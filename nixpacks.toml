# How Coolify (Nixpacks) builds and runs the shop: one app. The API server
# also serves the built storefront, so the whole site is on one domain.
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.build]
cmds = [
  "pnpm --filter @workspace/xtine-store run build",
  "pnpm --filter @workspace/api-server run build",
]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
