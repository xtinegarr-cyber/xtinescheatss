<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Roblox gamepasses and items</title><desc id="desc">A red and dark geometric gaming storefront illustration</desc>
