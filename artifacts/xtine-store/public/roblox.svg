<rect width="1200" height="700" rx="42" fill="url(#bg)"/><circle cx="960" cy="120" r="210" fill="#e51d48" opacity=".18" filter="url(#glow)"/><circle cx="180" cy="650" r="260" fill="#ff405f" opacity=".12" filter="url(#glow)"/>
<g transform="translate(735 95) rotate(12 190 190)"><rect x="25" y="25" width="330" height="330" rx="42" fill="url(#red)"/><rect x="130" y="130" width="120" height="120" rx="20" fill="#180b15"/></g>
