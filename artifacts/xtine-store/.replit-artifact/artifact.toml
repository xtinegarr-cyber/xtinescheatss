kind = "web"
previewPath = "/"
title = "X Tine Cheats"
description = "A digital gaming-products storefront with a secure checkout flow and post-purchase product access."
version = "1.0.0"
id = "artifacts/xtine-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19058

[services.development]
run = "pnpm --filter @workspace/xtine-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xtine-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/xtine-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19058"
BASE_PATH = "/"
